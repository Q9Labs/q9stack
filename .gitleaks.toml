# Project gitleaks config: default ruleset plus reviewed false positives.
title = "q9stack"

[extend]
useDefault = true

[[allowlists]]
description = "Prose listing UI states ('auth screens: default/invalid/submitting') trips generic-api-key."
regexTarget = "match"
regexes = ['''auth screens: default/invalid/submitting''']

[[allowlists]]
description = "Raw dogfood session transcripts (multi-megabyte, already reviewed); decoding them stalls the scan."
paths = ['''^scratchpad/dogfood/.*transcript''']
