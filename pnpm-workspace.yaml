# dependency-cruiser 18 needs the JS TypeScript compiler API (<7). Root typescript is 7 (tsgo);
# give depcruise its own parser-only TypeScript so it can cruise .ts/.tsx sources.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

# @effect/vitest 0.30 (Effect 3 line) declares vitest ^3.2; packages/ai tests verify Vitest 5 compatibility.
peerDependencyRules:
  allowedVersions:
    "@effect/vitest>vitest": "5"
