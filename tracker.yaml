schema_version: 7
principle: >-
  Track meaningful product outcomes and concrete remaining work, not completed setup or CRUD
  inventory. Audited against the current local working tree on 2026-09-08. Working means only the
  explicitly stated source scope is implemented; it is not live-release certification. Planned means
  a specific implementation gap was found; unknown names the exact proof still unavailable. P0
  first, P1 next, P2 later. Retire basic completed items; consolidate related outcomes without
  discarding unresolved scope.
sizing: >-
  Estimate remaining work, not elapsed time. S: one focused change. M: several connected changes. L:
  substantial cross-cutting work; split before starting. Unknown: investigate before sizing. Working
  entries have no remaining work to size. Waiting does not increase size. Revisit estimates when the
  work is inspected.
outcomes:
  - id: toolkit.scaffold
    title: Developers scaffold a Convex or Postgres project from thin overlays
    area: toolkit
    state: working
    summary: >-
      The scaffold composes base/backend overlays, rewrites tokens/dependencies and checks target
      output. This is the generator source contract, not proof that every fresh app starts against
      configured infrastructure.
    theory: theory.md#scope-boundaries
    code:
      - packages/create-q9stack/src/core/plan.ts
      - packages/create-q9stack/src/core/overlay.ts
      - packages/create-q9stack/src/adapters/scaffold.ts
    evidence:
      - kind: source_review
        scope: Current implementation audit; not a live environment test
        detail: >-
          The scaffold composes base/backend overlays, rewrites tokens/dependencies and checks
          target output. This is the generator source contract, not proof that every fresh app
          starts against configured infrastructure.
        artifact: packages/create-q9stack/src/core/plan.ts
        revision: 035f93d + local working-tree changes
        environment: Local source inspection
        date: "2026-09-08"
        result: pass
