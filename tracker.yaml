    size: L
    size_reason: One new package with three subcommand groups, a shadcn registry item and scaffold wiring.
    remaining:
      - >-
        Publish @q9labsai/cli with q9 tracker check|list|show, q9 dev
        start|status|logs|stop|reset and q9 changelog add|release|check|export, each with --json.
      - >-
        Delete the tracker renderer, server and generated tracker-human views, and run q9 tracker
        check in the q9stack gate.
      - >-
        Ship the changelog dialog as a shadcn registry item that reads the exported changelog JSON
        and uses only semantic tokens and logical classes.
      - Replace the local tracker, dev-log and changelog scripts in each product during fleet adoption.
