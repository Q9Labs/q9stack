name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      API_URL: http://localhost:3001
      API_PORT: "3001"
      APP_ENV: dev
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-thirty-two-characters
      LOG_LEVEL: info
      OPENROUTER_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate project docs
        run: pnpm tracker:check && pnpm changelog:check

      - name: Run base gate
        run: pnpm exec q9gate run --base origin/main

      - name: Upload gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate.report.json
          if-no-files-found: ignore
