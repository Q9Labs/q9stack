  "@stryker-mutator/vitest-runner": 10.0.0
  turbo: 2.11.3
  tsx: 4.23.15
  tsdown: 0.23.0
  oxlint: 1.85.0
  oxlint-tsgolint: 7.0.2003
  oxfmt: 0.70.0
  fallow: 3.28.0
  dependency-cruiser: 18.4.0
  syncpack: 15.3.3
  cspell: 10.3.3
  lefthook: 2.1.14
  typescript: 7.0.2
  "@q9labsai/config-depcruise": ^0.3.0
  "@q9labsai/config-oxlint": ^0.3.0
  "@q9labsai/config-semgrep": ^0.3.0
  "@q9labsai/config-tsconfig": ^0.3.0
  "@q9labsai/cli": ^0.4.0
  "@q9labsai/diagnostics": ^0.4.0
  "@q9labsai/diagnostics-server": ^0.4.0
  "@q9labsai/env": ^0.3.0
  "@q9labsai/gates": ^0.3.0
  "@q9labsai/ui": ^0.3.0

peerDependencyRules:
  allowedVersions:
    # @effect/vitest 0.30 declares Vitest 3; template tests verify Vitest 5 compatibility.
    "@effect/vitest>vitest": "5"

overrides:
  # Fix qs advisories GHSA-q8mj-m7cp-5q26, GHSA-4mjr-xmp4-gh2g, and
  # GHSA-x5fp-wj9c-mxmx in the transitive Stryker typed-rest-client dependency.
  qs: 6.16.0
  # Keep the Effect type identity shared with the currently published q9 packages.
  effect: "catalog:"

# dependency-cruiser 18 needs TypeScript <7 to analyze .ts/.tsx files.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
